name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-pipeline:
    name: Dev Pipeline (Format, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/dev'
    env:
      JAVA_VERSION: 21
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          set-safe-directory: true

      - name: Add permissions
        run: chmod +x gradlew

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Run Tests
        run: ./gradlew test --parallel --max-workers=4 --stacktrace --info

      - name: Auto-format code
        run: ./gradlew spotlessApply

      - name: Check for changes
        id: check_changes
        run: |
          git config core.filemode false
          git add -A
          if git diff --cached --ignore-space-change --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No meaningful changes, skipping commit."
            git reset --hard HEAD
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Meaningful changes detected, will commit."
          fi
        shell: bash

      - name: Commit formatted changes
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: IAreKyleW00t/verified-bot-commit@v2
        with:
          message: "style: auto-format code [skip ci]"
          files: "**"

      - name: Build and Upload Artifact
        run: ./gradlew build --build-cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Dev Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-mod-package
          path: build/libs/*.jar

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-dev
          path: |
            build/test-results/test/**/*.xml
            build/reports/tests/test/

  main-pipeline:
    name: Main Pipeline (Build and Release)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    env:
      JAVA_VERSION: 21
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          set-safe-directory: true

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build Artifact
        run: ./gradlew build --build-cache

      - name: Upload Artifact for Release
        uses: actions/upload-artifact@v7
        with:
          name: mod-package
          path: build/libs/*.jar

  release:
    name: Publish Release
    needs: main-pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: mod-package
          path: release-files/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.jar
          draft: true
          generate_release_notes: true
