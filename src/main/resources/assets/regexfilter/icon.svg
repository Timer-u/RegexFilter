<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  width="1024"
  height="1024"
>
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56c4ec" />
      <stop offset="25%" stop-color="#8e9eff" />
      <stop offset="50%" stop-color="#c57bff" />
      <stop offset="75%" stop-color="#e58ed0" />
      <stop offset="100%" stop-color="#eaa3b1" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-color="#0a0a0a"
        flood-opacity="0.4"
      />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.7" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="8"
        flood-color="#0a0a0a"
        flood-opacity="0.3"
      />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="url(#gradMain)" opacity="0.15">
    <circle cx="150" cy="180" r="20" />
    <circle cx="850" cy="400" r="12" />
    <circle cx="200" cy="650" r="16" />
    <circle cx="800" cy="800" r="24" />
    <circle cx="350" cy="900" r="10" />
  </g>

  <g
    font-family="monospace"
    font-weight="bold"
    fill="url(#gradMain)"
    opacity="0.15"
    text-anchor="middle"
  >
    <text x="120" y="120" font-size="60" transform="rotate(-15, 120, 120)">
      *
    </text>
    <text x="920" y="180" font-size="80" transform="rotate(10, 920, 180)">
      +
    </text>
    <text x="180" y="520" font-size="90" transform="rotate(-10, 180, 520)">
      ?
    </text>
    <text x="880" y="620" font-size="100" transform="rotate(20, 880, 620)">
      .
    </text>
    <text x="320" y="160" font-size="70" transform="rotate(-5, 320, 160)">
      \d
    </text>
    <text x="780" y="880" font-size="80" transform="rotate(15, 780, 880)">
      \s
    </text>
    <text x="500" y="100" font-size="50" transform="rotate(5, 500, 100)">
      \b
    </text>
    <text x="600" y="950" font-size="65" transform="rotate(-12, 600, 950)">
      \B
    </text>
  </g>

  <g
    font-family="monospace"
    font-weight="bold"
    fill="url(#gradMain)"
    opacity="0.25"
    text-anchor="middle"
  >
    <text x="220" y="280" font-size="220" transform="rotate(-5, 220, 280)">
      ^
    </text>
    <text x="804" y="260" font-size="180" transform="rotate(4, 804, 260)">
      $
    </text>
    <text x="220" y="720" font-size="120" transform="rotate(3, 220, 720)">
      [a-z]
    </text>
    <text x="804" y="720" font-size="140" transform="rotate(-6, 804, 720)">
      \w+
    </text>
  </g>

  <g transform="translate(0, -60)" filter="url(#glowSoft)">
    <path
      d="M 312 350 
             L 712 350 
             C 740 350 750 370 735 385 
             L 580 540 
             L 580 680 
             C 580 710 560 720 540 720 
             L 484 720 
             C 464 720 444 710 444 680 
             L 444 540 
             L 289 385 
             C 274 370 284 350 312 350 Z"
      fill="none"
      stroke="url(#gradMain)"
      stroke-width="44"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <line
      x1="360"
      y1="350"
      x2="664"
      y2="350"
      stroke="#fff"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.6"
    />

    <text
      x="512"
      y="460"
      font-family="monospace"
      font-weight="900"
      font-size="100"
      fill="url(#gradMain)"
      text-anchor="middle"
      letter-spacing="5"
      filter="url(#glow)"
    >
      .*
    </text>
  </g>

  <text
    x="512"
    y="870"
    font-family="'Nunito', 'Quicksand', 'Varela Round', 'Comic Sans MS', sans-serif"
    font-weight="900"
    font-size="125"
    fill="url(#gradMain)"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="1.5"
  >
    RegexFilter
  </text>
</svg>
